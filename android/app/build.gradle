plugins {
    id 'com.android.application'
    id 'kotlin-android'
    id 'com.google.gms.google-services'
}

android {
    namespace 'com.joyfuldays.app'
    compileSdk 34

    defaultConfig {
        applicationId "com.joyfuldays.app"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0.0"

        // Default Production Backend Base URL
        buildConfigField "String", "BACKEND_BASE_URL", "\"https://com-backend-joyfuldays.ai.studio\""
    }

    buildTypes {
        debug {
            // Debug / development build: Defaults to stable backend or custom dev URL if overridden
            buildConfigField "String", "BACKEND_BASE_URL", "\"https://com-backend-joyfuldays.ai.studio\""
        }
        release {
            minifyEnabled true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Production release build: Enforces stable production backend base URL
            buildConfigField "String", "BACKEND_BASE_URL", "\"https://com-backend-joyfuldays.ai.studio\""
        }
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.12.0'
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'com.google.android.material:material:1.11.0'
    implementation platform('com.google.firebase:firebase-bom:32.7.4')
    implementation 'com.google.firebase:firebase-firestore-ktx'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
}
